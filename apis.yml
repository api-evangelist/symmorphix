name: Symmorphix
description: >-
  Symmorphix, Inc. was a materials-science company founded in 1998 and based in
  Sunnyvale, California, that developed and manufactured advanced amorphous
  dielectric and optical thin films for the optical-networking and
  communications industries. Its core technology was a proprietary wide-area
  physical vapor deposition (PVD) process performed at low temperatures,
  enabling deposition of a broad range of material compositions onto metal,
  ceramic, and polymer substrates for use as physical barriers, dielectric
  layers, and optical layers. The company was venture-backed by Battery Ventures
  and Crescendo Ventures and was acquired by Springworks on February 6, 2004. It
  is a defunct hardware/materials company with no public API, developer portal,
  or software developer surface, and is retained in the API Evangelist network
  only as a historical portfolio-lead record.
